name: Test APM Packages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-packages:
    name: test-packages
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Install APM CLI
        uses: ./.github/actions/install-apm

      - name: Detect changed package directories
        id: diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_packages=""
          for dir in */; do
            dirname="$(basename "$dir")"
            case "$dirname" in
              examples|wrappers|scripts|docs|site|apm_modules|.git|.github|.claude) continue ;;
            esac
            if [ -f "$dir/apm.yml" ] && git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" | grep -q "^${dirname}/"; then
              changed_packages="$changed_packages $dirname"
            fi
          done

          changed_packages="$(echo "$changed_packages" | xargs)"
          echo "packages=$changed_packages" >> "$GITHUB_OUTPUT"

          if [ -n "$changed_packages" ]; then
            echo "Changed packages: $changed_packages"
          else
            echo "No package directories changed"
          fi

      - name: Run package tests
        env:
          TEST_PACKAGES: ${{ steps.diff.outputs.packages }}
        run: |
          if [ -n "$TEST_PACKAGES" ]; then
            ./scripts/test-packages.sh --ci $TEST_PACKAGES
          else
            echo "No package directories changed — nothing to validate."
          fi
