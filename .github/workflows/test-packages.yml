name: Test APM Packages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-packages:
    name: test-packages
    # Draft pull requests are skipped. A skipped job satisfies a required
    # status check, but a draft pull request cannot be merged at all, and
    # `ready_for_review` is in the trigger list above, so promoting a draft
    # re-runs this job with the draft check false and a real result.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Install APM CLI
        uses: ./.github/actions/install-apm

      - name: Detect changed package directories
        id: diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_packages=""
          for dir in */; do
            dirname="$(basename "$dir")"
            case "$dirname" in
              examples|wrappers|scripts|docs|site|apm_modules|.git|.github|.claude) continue ;;
            esac
            if [ -f "$dir/apm.yml" ] && git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" | grep -q "^${dirname}/"; then
              changed_packages="$changed_packages $dirname"
            fi
          done

          changed_packages="$(echo "$changed_packages" | xargs)"
          echo "packages=$changed_packages" >> "$GITHUB_OUTPUT"

          if [ -n "$changed_packages" ]; then
            echo "Changed packages: $changed_packages"
          else
            echo "No package directories changed"
          fi

      - name: Validate changed packages
        env:
          TEST_PACKAGES: ${{ steps.diff.outputs.packages }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_PACKAGES" ]; then
            ./scripts/test-packages.sh --ci $TEST_PACKAGES
          else
            echo "::notice::No package directories changed - package validation is skipped."
            echo "::notice::The pre-commit gate self-test below still runs, so this check is not a no-op."
          fi

      - name: Self-test the pre-commit gate
        # scripts/test-pre-commit-hook.sh exercises the local gate itself: the
        # staged-package mapper, the pre-commit entrypoint, the husky wiring in
        # a fresh clone, and the pre-push refusal. It needs node and the npm
        # registry, and it runs against the checked-out commit.
        run: |
          set -euo pipefail
          node --version
          npm --version
          ./scripts/test-pre-commit-hook.sh
