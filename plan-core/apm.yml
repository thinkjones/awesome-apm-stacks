name: plan-core
version: 0.0.3
description: >
  Planning and task management — PRD generation, requirements refinement,
  epic/feature breakdown, QA planning, and implementation strategy.

dependencies:
  apm:
    # ── Project planning (epics, features, tasks, technical spikes) ──
    - github/awesome-copilot/plugins/project-planning

    # ── PRD generator agent ──
    - github/awesome-copilot/agents/prd.agent.md

    # ── Requirements → acceptance criteria, edge cases, NFRs ──
    - github/awesome-copilot/agents/specification.agent.md

    # ── QA — test planning, bug hunting, edge-case analysis ──
    - github/awesome-copilot/agents/qa-subagent.agent.md

    # ── mattpocock/skills — planning skills ──
    - mattpocock/skills/skills/engineering/to-spec
    - mattpocock/skills/skills/engineering/wayfinder
    - mattpocock/skills/skills/engineering/to-tickets
    - mattpocock/skills/skills/engineering/triage
